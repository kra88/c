<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多行转换</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #e2e8f0;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 840px;
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 36px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
        }

        h2 {
            margin-bottom: 24px;
            color: #f8fafc;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .box {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 500;
            margin-bottom: 10px;
            color: #94a3b8;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            height: 240px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 14px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            resize: vertical;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        textarea::placeholder {
            color: #64748b;
        }

        textarea:focus {
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.6);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15),
                        inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 20px;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
        }

        button:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            box-shadow: 0 6px 16px rgba(14, 165, 233, 0.35);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px) scale(0.98);
        }

        button.special {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        button.special:hover {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
        }

        button.custom-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
        }

        button.custom-btn:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
        }

        button.danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            box-shadow: none;
        }

        button.danger:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        button.copy-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
            margin-left: auto;
        }

        button.copy-btn:hover {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }

        .stats-wrapper {
            display: flex;
            align-items: center;
        }

        .stats {
            font-size: 13px;
            color: #64748b;
            background: rgba(15, 23, 42, 0.3);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        #toast {
            position: absolute;
            top: 20px;
            right: 36px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(-10px);
            z-index: 100;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        #toast.error {
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        @media (max-width: 650px) {
            .actions {
                flex-direction: column;
                align-items: stretch;
            }
            button.copy-btn {
                margin-left: 0;
            }
            .stats-wrapper {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="toast">提示信息</div>

    <h2>多行转换工具</h2>
    
    <div class="grid">
        <div class="box">
            <label for="input-text">输入原始文本</label>
            <textarea id="input-text" placeholder="在此粘贴数据..."></textarea>
        </div>
        
        <div class="box">
            <label for="output-text">转换结果</label>
            <textarea id="output-text" placeholder="转换后的内容..." readonly></textarea>
        </div>
    </div>

    <div class="actions">
        <button onclick="formatText()">换行转换</button>
        <button class="special" onclick="filterAndTransformParams()">过滤</button>
        <button class="custom-btn" onclick="formatDepositParams()">首复存</button>
        <button class="danger" onclick="clearContent()">清除内容</button>
        
        <button class="copy-btn" onclick="copyResult()">复制</button>
        <div class="stats-wrapper">
            <span class="stats" id="stats-info">共 0 行</span>
        </div>
    </div>
</div>

<script>
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.className = isError ? 'error show' : 'show';

        if (window.toastTimer) clearTimeout(window.toastTimer);

        window.toastTimer = setTimeout(() => {
            toast.className = '';
        }, 2500);
    }

    function formatText() {
        const input = document.getElementById('input-text').value;
        const items = input.split(/[\s,，、;]+/).filter(Boolean);
        const result = items.join('\n');
        
        document.getElementById('output-text').value = result;
        document.getElementById('stats-info').innerText = `共 ${items.length} 行`;
    }

    function filterAndTransformParams() {
        const input = document.getElementById('input-text').value;
        if (!input.trim()) {
            showToast('请输入需要处理的文本！', true);
            return;
        }

        const lines = input.split(/\r?\n/);
        const processedLines = [];

        lines.forEach(line => {
            if (!line.trim()) return;

            let currentLine = line.trim();

            let timeMatch = currentLine.match(/\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}/);
            let protectedTime = '';
            if (timeMatch) {
                protectedTime = timeMatch[0];
                currentLine = currentLine.replace(protectedTime, protectedTime.replace(' ', '___TIME_SPACE___'));
            }

            const params = currentLine.split(/[\s；、，]+/).filter(Boolean);
            const restoredParams = params.map(p => p.replace('___TIME_SPACE___', ' '));

            if (restoredParams.length >= 7) {
                const filtered = [
                    restoredParams[0],
                    restoredParams[1],
                    restoredParams[2],
                    restoredParams[3],
                    restoredParams[6]
                ];
                
                processedLines.push(filtered.join(' '));
            }
        });

        document.getElementById('output-text').value = processedLines.join('\n');
        document.getElementById('stats-info').innerText = `有效保留 ${processedLines.length} 组`;
        showToast('过滤完成！');
    }

    // 首复存功能（支持单组纵向、多组横向拼接）
    function formatDepositParams() {
        const input = document.getElementById('input-text').value;
        if (!input.trim()) {
            showToast('请输入需要处理的文本！', true);
            return;
        }

        const lines = input.split(/\r?\n/);
        const allParsedParams = [];

        lines.forEach(line => {
            if (!line.trim()) return;

            let currentLine = line.trim();

            // 保护第7个参数的时间，避免被空格切断
            let timeMatch = currentLine.match(/\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}/);
            if (timeMatch) {
                let protectedTime = timeMatch[0];
                currentLine = currentLine.replace(protectedTime, protectedTime.replace(' ', '___TIME_SPACE___'));
            }

            // 切分参数（忽略第2个参数中的英文逗号和点号）
            const params = currentLine.split(/[\s；、，]+/).filter(Boolean);
            const restoredParams = params.map(p => p.replace('___TIME_SPACE___', ' '));

            if (restoredParams.length >= 7) {
                allParsedParams.push({
                    p1: restoredParams[0],
                    p2: restoredParams[1],
                    p4: restoredParams[3],
                    p7: restoredParams[6]
                });
            }
        });

        if (allParsedParams.length === 0) {
            showToast('没有符合要求的有效数据（至少需要7个参数）！', true);
            return;
        }

        let resultStr = '';

        if (allParsedParams.length === 1) {
            // 只有一组时的格式
            const item = allParsedParams[0];
            resultStr = 
`会员账号: ${item.p1}
存款金额: ${item.p2}
申请彩金: ${item.p4}
存款日期: ${item.p7}

            `;
        } else {
            // 多组时的横向拼接格式
            const p1List = allParsedParams.map(item => item.p1).join('  ');
            const p2List = allParsedParams.map(item => item.p2).join('  ');
            const p4List = allParsedParams.map(item => item.p4).join('  ');
            const p7List = allParsedParams.map(item => item.p7).join('  ');

            resultStr = 
`会员账号: ${p1List}
存款金额: ${p2List}
申请彩金: ${p4List}
存款日期: ${p7List}

            `;
        }

        document.getElementById('output-text').value = resultStr;
        document.getElementById('stats-info').innerText = `成功处理 ${allParsedParams.length} 组数据`;
        showToast('首复存整理完成！');
    }

    function clearContent() {
        document.getElementById('input-text').value = '';
        document.getElementById('output-text').value = '';
        document.getElementById('stats-info').innerText = '共 0 行';
        showToast('内容已清除');
    }

    function copyResult() {
        const outputText = document.getElementById('output-text');
        const textToCopy = outputText.value;
        
        if (!textToCopy) {
            showToast('当前没有可复制的内容！', true);
            return;
        }
        
        navigator.clipboard.writeText(textToCopy).then(() => {
            showToast('复制成功！');
        }).catch(err => {
            console.error('复制失败: ', err);
            showToast('复制失败，请手动复制。', true);
        });
    }
</script>

</body>
</html>
